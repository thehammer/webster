name: CI

on:
  push:
    branches: [main, master]
  # Every PR, whatever it targets. Stacked PRs base on their predecessor
  # rather than main, so a main-only filter silently skips CI on all but
  # the bottom of a stack.
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck
